[project]
name = "tvmux"
description = "terminal multiplexer recorder"
version = "0.6.3"
authors = [
    { name = "Gareth Davidson", email = "gaz@bitplane.net" }
]
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "click>=8.5.0",
    "pydantic>=2.14.1",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "httpx2>=2.16.0",
    "psutil>=7.2.2",
    "asciinema>=2.4.0",
    "requests>=2.34.2",
    "tomli-w>=1.2.0",
    "textual>=8.2.8",
    "textual-asciinema>=0.1.0"
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "coverage>=7.17.0",
    "pytest-cov>=7.1.0",
    "build>=1.6.1",
    "twine>=7.0.0",
    "ruff>=0.17.3",
    "pydoc-markdown>=4.8.2"
]

[build-system]
build-backend = "flit_core.buildapi"
requires = ["flit_core>=4.2,<5"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[project.scripts]
tvmux = "tvmux.cli.main:cli"
